<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TR01.01 - Errors amb throw i try/catch</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    #missatge {
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      font-weight: bold;
    }
    .error {
      background-color: #ffe0e0;
      color: #b00020;
      border: 1px solid #b00020;
    }
    .ok {
      background-color: #e0ffe0;
      color: #006600;
      border: 1px solid #006600;
    }
  </style>
</head>
<body>
  <h1>Prova d'errors amb throw i try/catch</h1>
  <p>Fes clic als botons per executar cada cas:</p>

  <button id="botoErrorCodi">Error per codi</button>
  <button id="botoErrorOpcio">Error per opció incorrecta</button>

  <p id="missatge">Encara no s'ha executat cap acció.</p>

  <script src="script.js"></script>
</body>
</html>
